# Equivalente ao bitbucket-pipelines.yml para GitHub Actions: gera o mesmo
# snapshot visual (PNG + PDF) do circle packing via o extrator headless
# (JavaParser) + screenshot.js (Puppeteer), a cada push ou pull request.
#
# Diferente do Bitbucket, aqui não instalamos Chromium via apt (o pacote
# chromium-browser não é mais instalável de forma confiável via apt nos
# runners ubuntu-latest atuais) — deixamos o Puppeteer baixar seu próprio
# Chromium durante o `npm ci`. Esse download (~200MB) é o motivo do "Run npm
# install" demorar minutos: fica em cache entre execuções (step "Cache
# Chromium do Puppeteer" abaixo), então só é pago de fato na primeira run ou
# quando a versão do Puppeteer muda no package-lock.json.

name: CodeExplorer — Visual Snapshot

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  snapshot:
    name: Gerar snapshot visual
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: headless

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
          cache: maven
          cache-dependency-path: headless/pom.xml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: headless/package-lock.json

      - name: Build do extrator standalone
        run: mvn package -q -f pom.xml

      - name: Extrair relações e gerar JSON
        run: java -jar target/extractor-cli.jar ../src/main/java output/graph.json

      # A cache do "Setup Node.js" acima só cobre os pacotes npm (node_modules)
      # — o binário do Chromium que o Puppeteer baixa no postinstall é uma
      # etapa separada, então precisa da sua própria cache aqui.
      - name: Cache Chromium do Puppeteer
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('headless/package-lock.json') }}

      - name: Instalar dependências Node
        run: npm ci

      - name: Gerar screenshot
        run: |
          COMMIT=$(echo "${{ github.sha }}" | cut -c1-8)
          DATE=$(date +%Y-%m-%d)
          MODULE="${{ github.event.repository.name }}"
          node screenshot.js output/graph.json "$COMMIT" "$DATE" "$MODULE"
          echo "Artefatos gerados:"
          ls -lh output/

      - name: Salvar artefatos
        uses: actions/upload-artifact@v7
        with:
          name: codeexplorer-snapshot-${{ github.sha }}
          path: |
            headless/output/*.png
            headless/output/*.pdf
          retention-days: 90