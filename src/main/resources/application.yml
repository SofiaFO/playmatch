spring:
    application:
        name: playmatch-api

    neo4j:
        uri: ${NEO4J_URI:bolt://localhost:7687}
        authentication:
            username: ${NEO4J_USERNAME:neo4j}
            password: ${NEO4J_PASSWORD}

management:
    endpoints:
        web:
            exposure:
                include: health
    health:
        neo4j:
            enabled: true